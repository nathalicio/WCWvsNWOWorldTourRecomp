name: Build Nintendo Switch NRO

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-switch:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitswitch:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build NRO
        run: |
          make

      - name: Upload NRO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: switch-build
          path: |
            *.nro
            build/*.nro
