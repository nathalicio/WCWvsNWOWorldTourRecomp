name: Build Nintendo Switch NRO

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-switch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup devkitPro & switch-dev
        run: |
          sudo apt-get update && sudo apt-get install -y wget ca-certificates build-essential cmake ninja-build
          wget https://apt.devkitpro.org/devkitpro-keyring.gpg
          sudo install -m 644 devkitpro-keyring.gpg /usr/share/keyrings/
          echo "deb [signed-by=/usr/share/keyrings/devkitpro-keyring.gpg] https://apt.devkitpro.org stable main" | sudo tee /etc/apt/sources.list.d/devkitpro.list
          sudo apt-get update
          sudo apt-get install -y switch-dev

      - name: Build NRO
        run: |
          source /etc/profile.d/devkit-env.sh
          make

      - name: Upload NRO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: switch-build
          path: |
            *.nro
            build/*.nro
